mute_for_alarm_disarm:
  name: Mute for alarm disarm
  description: >-
    Save the speaker's current volume, set it to 0 so UniFi Alarm Manager
    playback is instantly silent, and schedule a restore of the saved volume
    after a delay (default 10 minutes).
  target:
    entity:
      integration: unifi_ai_speaker
    device:
      integration: unifi_ai_speaker
  fields:
    restore_delay:
      name: Restore delay
      description: >-
        Seconds to wait before restoring the saved volume. Omit to use the
        integration option (default 600 seconds / 10 minutes).
      required: false
      example: 600
      selector:
        number:
          min: 10
          max: 3600
          step: 1
          unit_of_measurement: seconds
          mode: box
    play_test_sound:
      name: Play test sound after alarm disarmed
      description: >-
        Play a short confirmation chime once the mute period ends, so you
        know it's over. Plays at its own Test sound volume (not the
        speaker's real/alarm volume) before the real volume is restored.
        Omit to use the integration option (default on).
      required: false
      example: true
      selector:
        boolean:
    test_sound_delay:
      name: Test sound delay
      description: >-
        Seconds to wait before and after playing the confirmation chime, so
        the volume change has time to apply and the chime has time to
        actually sound before the volume changes again. Omit to use the
        integration option (default 2 seconds).
      required: false
      example: 2
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: seconds
          mode: box
    test_sound_volume:
      name: Test sound volume
      description: >-
        Volume to set before playing the confirmation chime (independent of
        the speaker's real/alarm volume, which is restored afterward). Keep
        this low for speakers mounted somewhere the chime would otherwise be
        startling. Omit to use the integration option (default 30).
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

restore_alarm_volume:
  name: Restore alarm volume
  description: >-
    Immediately restore the speaker's saved volume and clear the alarm mute
    (ends the mute early).
  target:
    entity:
      integration: unifi_ai_speaker
    device:
      integration: unifi_ai_speaker

cancel_alarm_mute:
  name: Cancel alarm mute
  description: >-
    Cancel a pending restore and restore the saved volume at once. Call this
    when the alarm re-arms or re-triggers so a new alarm is audible.
  target:
    entity:
      integration: unifi_ai_speaker
    device:
      integration: unifi_ai_speaker

trigger_alarm:
  name: Trigger alarm
  description: >-
    Trigger the console's UniFi Alarm Manager webhook, so an alarm panel like
    Alarmo can start the alarm through this integration instead of a separate
    rest_command. The target only identifies which console to use (by any
    entity/device of a speaker on it) and does not affect speaker state
    itself.
  target:
    entity:
      integration: unifi_ai_speaker
    device:
      integration: unifi_ai_speaker
  fields:
    webhook_id:
      name: Webhook ID
      description: >-
        The Alarm Manager automation's webhook ID (a GUID from its webhook
        URL in Protect). Omit to use the ID configured in the integration's
        options.
      required: false
      example: 695d5662-8940-42ef-a3e9-239cbd873d91
      selector:
        text:
